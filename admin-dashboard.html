<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - MUN COMPUTER BUSINESS MANAGER</title>
    <meta name="description" content="MUN COMPUTER Administrator Dashboard - Full control over business operations, customer database, PNB CSP, finances, and system settings in Domkal, Murshidabad." />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b192c; color:#ffffff; font-family:sans-serif;">
        <div style="text-align:center; padding:2rem;">
          <div style="width:64px; height:64px; border-radius:14px; background:linear-gradient(135deg, #2563eb, #1d4ed8); display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; margin-bottom:14px; box-shadow:0 8px 24px rgba(37,99,235,0.4);">
            MUN
          </div>
          <div style="font-size:1.35rem; font-weight:800; letter-spacing:-0.02em;">MUN COMPUTER BUSINESS MANAGER</div>
          <div style="display:inline-block; margin-top:8px; padding:4px 12px; background:rgba(37,99,235,0.25); border:1px solid #3b82f6; border-radius:20px; font-size:0.8rem; font-weight:700; color:#93c5fd;">
            👑 ADMINISTRATOR DASHBOARD
          </div>
          <div style="font-size:0.85rem; color:#94a3b8; margin-top:10px;">
            Initializing Admin session & full system access...
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { getCurrentUser, ROLES } from '/js/auth.js';
      import { initializeStorage } from '/js/storage.js';

      initializeStorage();
      const user = getCurrentUser();
      if (!user || (user.role !== ROLES.ADMIN && user.role !== ROLES.MANAGER)) {
        window.location.replace('/');
      } else {
        window.location.hash = '#dashboard';
        import('/js/app.js');
      }
    </script>
  </body>
</html>
